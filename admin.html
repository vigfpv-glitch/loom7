<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Loom7 Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#211f1b;--muted:#726d66;--paper:#f8f6f1;--accent:#b18a65;--line:#e9e4db;--white:#fff;--danger:#a33b32;--ok:#286747}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:72px;padding:0 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#fff}.brand{font:600 23px 'Playfair Display',serif;letter-spacing:.08em}.top small{color:var(--muted)}.wrap{max-width:1180px;margin:42px auto;padding:0 24px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.heading h1{font:500 40px 'Playfair Display',serif;margin:0 0 7px}.heading p{color:var(--muted);margin:0}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab,.btn{border:1px solid var(--line);background:#fff;padding:11px 15px;color:var(--ink);font-weight:600}.tab[aria-selected=true],.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.panel{background:#fff;border:1px solid var(--line);padding:22px}.panel h2{font:500 24px 'Playfair Display',serif;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(270px,.85fr) 1.5fr;gap:20px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);padding:11px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:12px 0 16px}.actions{display:flex;gap:8px}.btn:hover,.tab:hover{border-color:var(--accent)}.btn.danger{color:var(--danger)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}td{font-size:13px}.thumb{width:46px;height:54px;object-fit:cover;background:var(--paper)}.status{font-size:11px;font-weight:700}.muted{color:var(--muted)}.notice{padding:12px 14px;margin-bottom:18px;background:#f2eee7;color:var(--muted)}.notice.error{background:#f8e9e7;color:var(--danger)}.notice.success{background:#eaf4ed;color:var(--ok)}.auth{max-width:430px;margin:12vh auto;padding:28px;background:#fff;border:1px solid var(--line)}.auth h1{font:500 32px 'Playfair Display',serif}.hidden{display:none!important}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:780px){.wrap{margin:26px auto;padding:0 14px}.heading{align-items:flex-start;gap:15px;flex-direction:column}.heading h1{font-size:34px}.layout{grid-template-columns:1fr}.panel{padding:16px}.top{padding:0 16px}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="index.html">LOOM7 <small> / ADMIN</small></a><button id="signout" class="btn hidden" type="button">Sign out</button></header>
  <main class="wrap">
    <section id="auth" class="auth"><h1>Admin sign in</h1><p class="muted">Sign in with an authorized Loom7 admin account.</p><div id="authNotice" class="notice hidden" role="status"></div><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" type="submit">Sign in</button></form></section>
    <section id="app" class="hidden">
      <div class="heading"><div><h1>Admin dashboard</h1><p>Manage the Loom7 collection and newsletter subscribers.</p></div></div>
      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-tab="products">Products</button><button class="tab" role="tab" aria-selected="false" data-tab="subscribers">Subscribers</button></div>
      <section id="productsPanel" class="panel"><div class="layout">
        <div><h2 id="formHeading">Add product</h2><form id="productForm"><input id="productId" type="hidden"><div class="field"><label for="productName">Product name</label><input id="productName" maxlength="120" required></div><div class="field"><label for="productDescription">Description</label><textarea id="productDescription" maxlength="1000"></textarea></div><div class="field"><label for="productImage">Image URL</label><input id="productImage" type="url" maxlength="1000" placeholder="https://…"></div><label class="check"><input id="productVisible" type="checkbox" checked> Show on the public website</label><div class="actions"><button class="btn primary" type="submit">Save product</button><button id="cancelEdit" class="btn hidden" type="button">Cancel</button></div></form></div>
        <div><h2>Products</h2><div id="productsList" class="table-wrap"><p class="muted">Loading products…</p></div></div>
      </div></section>
      <section id="subscribersPanel" class="panel hidden"><h2>Newsletter subscribers <span id="subscriberCount" class="muted"></span></h2><p class="muted">People who signed up for product updates and offers.</p><div id="subscribersList" class="table-wrap"><p class="muted">Loading subscribers…</p></div></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Browser-safe project URL and publishable key. Never use a service-role key here.
    const SUPABASE_URL = 'https://oofrtvkdljiphcsydcjo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_18ficoJXs66FopQnhcmkbA_kpDSF3yX';
    const $ = (id) => document.getElementById(id);
    const authView = $('auth'), appView = $('app'), authNotice = $('authNotice'), notice = $('notice');
    let db = null;
    const escapeHtml = (value='') => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function showMessage(node, text, type='') { node.textContent=text; node.className='notice'+(type?' '+type:''); }
    function showAuth() { authView.classList.remove('hidden'); appView.classList.add('hidden'); $('signout').classList.add('hidden'); }
    async function isAdmin(user) { const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle(); if(error) throw error; return !!data; }
    async function enterApp(user) { if(!await isAdmin(user)) { await db.auth.signOut(); showAuth(); showMessage(authNotice,'This account is not authorized for the admin panel.','error'); return; } authView.classList.add('hidden'); appView.classList.remove('hidden'); $('signout').classList.remove('hidden'); await Promise.all([loadProducts(),loadSubscribers()]); }
    async function loadProducts() { const box=$('productsList'); box.innerHTML='<p class="muted">Loading products…</p>'; const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false}); if(error) { box.textContent='Could not load products: '+error.message; return; } if(!data.length) { box.innerHTML='<div class="empty">No products yet. Add one using the form.</div>'; return; } box.innerHTML='<table><thead><tr><th>Image</th><th>Product</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+data.map(p=>'<tr><td>'+(p.image_url?'<img class="thumb" src="'+escapeHtml(p.image_url)+'" alt="">':'—')+'</td><td><strong>'+escapeHtml(p.name)+'</strong><br><span class="muted">'+escapeHtml(p.description||'')+'</span></td><td><span class="status">'+(p.is_visible?'Visible':'Hidden')+'</span></td><td><button class="btn" data-edit="'+p.id+'">Edit</button> <button class="btn danger" data-delete="'+p.id+'">Delete</button></td></tr>').join('')+'</tbody></table>'; box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editProduct(data.find(p=>p.id===b.dataset.edit)))); box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteProduct(b.dataset.delete))); }
    async function loadSubscribers() { const box=$('subscribersList'); box.innerHTML='<p class="muted">Loading subscribers…</p>'; const {data,error}=await db.from('newsletter_subscribers').select('id,email,full_name,consented_at').order('consented_at',{ascending:false}); if(error) { box.textContent='Could not load subscribers: '+error.message; return; } $('subscriberCount').textContent='('+data.length+')'; if(!data.length) { box.innerHTML='<div class="empty">No newsletter subscribers yet.</div>'; return; } box.innerHTML='<table><thead><tr><th>Name</th><th>Email</th><th>Consent date</th></tr></thead><tbody>'+data.map(s=>'<tr><td>'+escapeHtml(s.full_name||'—')+'</td><td>'+escapeHtml(s.email)+'</td><td>'+new Date(s.consented_at).toLocaleDateString()+'</td></tr>').join('')+'</tbody></table>'; }
    function editProduct(p) { $('productId').value=p.id; $('productName').value=p.name; $('productDescription').value=p.description||''; $('productImage').value=p.image_url||''; $('productVisible').checked=p.is_visible; $('formHeading').textContent='Edit product'; $('cancelEdit').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}); }
    function resetProductForm() { $('productForm').reset(); $('productId').value=''; $('productVisible').checked=true; $('formHeading').textContent='Add product'; $('cancelEdit').classList.add('hidden'); }
    async function deleteProduct(id) { if(!confirm('Delete this product? This cannot be undone.')) return; const {error}=await db.from('products').delete().eq('id',id); if(error) showMessage(notice,'Could not delete product: '+error.message,'error'); else { showMessage(notice,'Product deleted.','success'); await loadProducts(); } }
    $('loginForm').addEventListener('submit',async e=>{e.preventDefault(); const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error) showMessage(authNotice,'Sign-in failed. Check your details and try again.','error'); else {authNotice.classList.add('hidden'); try { await enterApp(data.user); } catch(err) { showMessage(authNotice,'Could not verify admin access. Check Supabase setup and try again.','error'); } }});
    $('productForm').addEventListener('submit',async e=>{e.preventDefault(); const id=$('productId').value; const values={name:$('productName').value.trim(),description:$('productDescription').value.trim()||null,image_url:$('productImage').value.trim()||null,is_visible:$('productVisible').checked}; const result=id?await db.from('products').update(values).eq('id',id):await db.from('products').insert(values); if(result.error) showMessage(notice,'Could not save product: '+result.error.message,'error'); else {showMessage(notice,'Product saved.','success');resetProductForm();await loadProducts();} });
    $('cancelEdit').addEventListener('click',resetProductForm);
    document.querySelectorAll('[data-tab]').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',String(t===tab))); const products=tab.dataset.tab==='products'; $('productsPanel').classList.toggle('hidden',!products); $('subscribersPanel').classList.toggle('hidden',products); }));
    $('signout').addEventListener('click',async()=>{await db.auth.signOut();showAuth();});
    if(!window.supabase) { showMessage(authNotice,'Could not load the Supabase client library. Check your connection and reload.','error'); }
    else { db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); db.auth.getSession().then(async ({data})=>{if(data.session) { try { await enterApp(data.session.user); } catch(e) { showAuth(); showMessage(authNotice,'Could not verify admin access. Check Supabase setup.','error'); } }}); }
  </script>
</body>
</html>
